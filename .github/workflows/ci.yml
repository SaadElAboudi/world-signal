name: Verify WORLD SIGNAL
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: world_signal
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: world_signal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U world_signal -d world_signal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WORLD_SIGNAL_MODE: demo
      TEST_DATABASE_URL: postgresql://world_signal:ci-test-only@127.0.0.1:5432/world_signal_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
