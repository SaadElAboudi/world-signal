name: Refresh world events (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: world-signal-production-events
  cancel-in-progress: false
jobs:
  events:
    if: vars.WORLD_SIGNAL_INGEST_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      DATABASE_URL: ${{ secrets.WORLD_SIGNAL_DATABASE_URL }}
      DATABASE_SSL_CA: ${{ secrets.WORLD_SIGNAL_DATABASE_CA }}
      DATABASE_POOL_MAX: "2"
      DATABASE_STORAGE_QUOTA_BYTES: "1073741824"
      WORLD_SIGNAL_MODE: live
      IODA_ENABLED: "false"
      OPEN_METEO_ENABLED: "true"
      OPEN_METEO_ENDPOINT: ${{ vars.OPEN_METEO_ENDPOINT || 'https://api.open-meteo.com/v1/forecast' }}
      OPEN_METEO_ARCHIVE_ENDPOINT: ${{ vars.OPEN_METEO_ARCHIVE_ENDPOINT || 'https://archive-api.open-meteo.com/v1/archive' }}
      OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Refresh normalized world events
        run: npm run events:refresh
